[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_31004E000A50304E47313020-if00

[mcu EBBCan]
canbus_uuid: 735b7698b684

[mcu host]
serial: /tmp/klipper_host_mcu

#####################################################################
# 	Macros
#####################################################################

[include mainsail.cfg]
[include Macros.cfg]
[include SpeedTest.cfg]
[exclude_object]
[gcode_arcs]
resolution: 0.25
[pause_resume]
[respond]
[exclude_object]
[include klicky-probe.cfg]

[include ADXLSB.cfg]
#[include ADXL345.cfg]
#[include ADXL345B.cfg]
#[include S2DW.cfg]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes

[idle_timeout]
timeout: 72000

#####################################################################
# 	XY Stepper Settings
#####################################################################

[stepper_x]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 32
rotation_distance: 40
#endstop_pin: !PA15
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 300
position_min: -2
position_max: 300
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD7
diag_pin: PD2
driver_SGTHRS: 100
sense_resistor: 0.110
run_current: 1.20 #1.15
#stealthchop_threshold: 999999
interpolate: True

[stepper_y]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
#endstop_pin: !PD2
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 300
position_min: -8
position_max: 300
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD5
diag_pin: PA15
driver_SGTHRS: 120
sense_resistor: 0.110
run_current: 1.20 #1.15
#stealthchop_threshold: 999999
interpolate: True

[autotune_tmc stepper_x]
motor: siboor-42sth48-2504(s45)
#tuning_goal: silent

[autotune_tmc stepper_y]
motor: siboor-42sth48-2504(s45)
#tuning_goal: silent

[autotune_tmc stepper_z]
motor: creality-42-40
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: creality-42-40
tuning_goal: silent

[autotune_tmc stepper_z2]
motor: creality-42-40
tuning_goal: silent

[autotune_tmc extruder]
#motor: ldo-36sth20-1004ahg
motor: fysetc-g36hsy4405-6d-1200
tuning_goal: performance

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 32
rotation_distance: 8
#endstop_pin: !PC8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 230

[tmc2209 stepper_z]
uart_pin: PD4
sense_resistor: 0.110
run_current: 0.8
#stealthchop_threshold: 999999
interpolate: True


[stepper_z1]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 32
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PD9
sense_resistor: 0.110
run_current: 0.8
#stealthchop_threshold: 999999
interpolate: True


[stepper_z2]
step_pin: PD15
dir_pin: !PA1
enable_pin: !PA3
microsteps: 32
rotation_distance: 8

[tmc2209 stepper_z2]
uart_pin: PD8
sense_resistor: 0.110
run_current: 0.8
#stealthchop_threshold: 999999
interpolate: True

#####################################################################
# 	Probe
#####################################################################

[probe]
pin: ^EBBCan:PB9
x_offset: 1.4
y_offset: 26.5
#z_offset: 2
speed: 8
samples: 3
samples_tolerance: 0.01
sample_retract_dist: 1
samples_tolerance_retries: 3
#samples_result: median

[bed_mesh]
zero_reference_position: 150, 150
adaptive_margin: 0
algorithm: bicubic
speed: 100
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 280,280
probe_count: 19, 19
faulty_region_1_min: 0.0, 36.0
faulty_region_1_max: 12.0, -8
faulty_region_2_min: 288, -8
faulty_region_2_max: 300, 36
mesh_pps: 3,3
fade_start: 1
fade_end: 10
split_delta_z: 0.025
#fade_target: 0

[z_tilt]

z_positions:
  -50, 18
  150, 348
  350, 18

points:
  30, 5
  30, 245
  270, 5

speed: 200
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.002


#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
# rotation_distance: 54.3
# gear_ratio: 44:10, 37:17
# rotation_distance: 4.64 #4.735
rotation_distance: 23.49 #23.52
gear_ratio: 50:10 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13 # Heat
sensor_type: Generic 3950
sensor_pin: EBBCan: PA3 # TH
min_extrude_temp: 17
min_temp: -100
max_temp: 300
max_power: 0.6
max_extrude_cross_section: 500 
max_extrude_only_distance: 1100

pressure_advance: 0.084 #PLA 0.4
pressure_advance_smooth_time: 0.010

control: pid #220
pid_Kp: 15.525
pid_Ki: 1.078
pid_Kd: 55.889


[input_shaper]
shaper_freq_x: 54.4
shaper_type_x: mzv
damping_ratio_x: 0.060

shaper_freq_y: 43.8
shaper_type_y: mzv
damping_ratio_y: 0.066

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.8
sense_resistor: 0.110
interpolate: true
stealthchop_threshold: 0

[filament_switch_sensor switch_sensor]
pause_on_runout: True #False
runout_gcode: 
  M117 Filament switch runout
  M118 Filament switch runout
  #M600
switch_pin: ^PE6

[filament_motion_sensor encoder_sensor]
switch_pin: ^PA4
detection_length: 9 #2.88 # accuracy of motion sensor 2.88mm
extruder: extruder 
pause_on_runout: True #False
runout_gcode:
  M117 Filament encoder runout
  M118 Filament encoder runout
  #M600

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
min_temp: -150
max_temp: 130

control: pid #60
pid_kp: 72.453
pid_ki: 0.707
pid_kd: 1855.710


#####################################################################
# 	Fan Control
#####################################################################

[fan]
pin: EBBCan:PA0

[heater_fan hotend_fan]
pin: EBBCan:PA1
shutdown_speed: 0
fan_speed: 1.0

[temperature_fan Chamber]
pin: PE5
kick_start_time: 0.0
shutdown_speed: 0.0
off_below: 0.1
max_power: 0.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
min_temp: -150
max_temp: 85
pid_kp: 30.0
pid_ki: 1.0
pid_kd: 175.0
pid_deriv_time: 1.0
min_speed: 0.0
max_speed: 1.0
target_temp: 50
gcode_id: CHAMBER_TEMP

[temperature_fan BTT-PI]
pin: PC14
max_power: 1.0
min_temp: 0
max_temp: 100
kick_start_time: 0.2
off_below: 0.2
sensor_type: temperature_host
control: pid
pid_kp: 2.0
pid_ki: 0.25
pid_kd: 5 #35.0
pid_deriv_time: 2.0
min_speed: 0.0
max_speed: 1.0
target_temp: 50

[temperature_fan MCU]
pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 100
kick_start_time: 0.2
off_below: 0.05
sensor_type: temperature_mcu
control: pid
pid_kp: 4.0
pid_ki: 1.0
pid_kd: 5.0
pid_deriv_time: 1.0
min_speed: 0.0
max_speed: 1.0
target_temp: 35

#[fan_generic Nevermore]
#pin: PE5
#max_power: 1.0
#kick_start_time: 0.5
#off_below: 0.1

[controller_fan Controller Fan]
pin: PB0


#####################################################################
# 	Temperature Sensors
#####################################################################

[temperature_sensor EBB_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: -100
max_temp: 150

[temperature_sensor Bed_2]
sensor_pin: PA2
sensor_type: EPCOS 100K B57560G104F
min_temp: -150
max_temp: 120

#####################################################################
# Kinematics Settings
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 30
max_z_accel: 350

