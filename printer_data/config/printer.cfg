[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_31004E000A50304E47313020-if00

[mcu host]
serial: /tmp/klipper_host_mcu

#####################################################################
# 	Macros
#####################################################################

[include mainsail.cfg]
[include Macros.cfg]
[include SpeedTest.cfg]
[exclude_object]
[gcode_arcs]
resolution: 0.25
[pause_resume]
[respond]
[exclude_object]
[include klicky-probe.cfg]

#[include ADXL345.cfg]
#[include ADXL345B.cfg]
[include S2DW.cfg]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes

[idle_timeout]
timeout: 72000

#####################################################################
# 	XY Stepper Settings
#####################################################################

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
#endstop_pin: !PA15
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 255
position_min: 0
position_max: 255
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD5
diag_pin: PA15
driver_SGTHRS: 100
sense_resistor: 0.110
run_current: 1.15
#stealthchop_threshold: 999999
interpolate: True

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 32
rotation_distance: 40
#endstop_pin: !PD2
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 285
position_min: -45
position_max: 285
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD7
diag_pin: PD2
driver_SGTHRS: 120
sense_resistor: 0.110
run_current: 1.15
#stealthchop_threshold: 999999
interpolate: True

[autotune_tmc stepper_x]
#motor: BTT-17H4401S
motor: ldo-42sth48-2504ac
#tuning_goal: silent

[autotune_tmc stepper_y]
#motor: BTT-17H4401S
motor: ldo-42sth48-2504ac
#tuning_goal: silent

[autotune_tmc stepper_z]
motor: BTT-17H4401S
tuning_goal: silent

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 32
rotation_distance: 8
#endstop_pin: !PC8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 335

[tmc2209 stepper_z]
uart_pin: PD4
sense_resistor: 0.110
run_current: 1.4
#hold_current: 0.6
#stealthchop_threshold: 999999
interpolate: True

#####################################################################
# 	Probe
#####################################################################

[probe]
pin: ^PC8
x_offset: 1.4
y_offset: 26.5
#z_offset: 2
speed: 8
samples: 3
samples_tolerance: 0.01
sample_retract_dist: 1
samples_tolerance_retries: 3
#samples_result: median

[bed_mesh]
zero_reference_position: 127.5, 138
adaptive_margin: 0
algorithm: bicubic
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 250,280
probe_count: 17, 19
faulty_region_1_min: 0.0, -45.0
faulty_region_1_max: 12.0, 26
faulty_region_2_min: 245, -45
faulty_region_2_max: 255, 26
mesh_pps: 3,3
fade_start: 1
fade_end: 10
split_delta_z: 0.025
#fade_target: 0

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
#rotation_distance: 54.3
#gear_ratio: 44:10, 37:17
rotation_distance:4.735
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: Generic 3950 #EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
min_extrude_temp: 17
min_temp: -100
max_temp: 300
max_power: 0.6
max_extrude_cross_section: 500 
max_extrude_only_distance: 1100

pressure_advance: 0.084 #PLA 0.4
pressure_advance_smooth_time: 0.010

control: pid #220
pid_Kp: 17.103
pid_Ki: 1.341
pid_Kd: 54.516


[input_shaper]
shaper_freq_x: 58.0
shaper_type_x: mzv
damping_ratio_x: 0.052

shaper_freq_y: 37.4
shaper_type_y: mzv
damping_ratio_y: 0.050

[tmc2209 extruder]
uart_pin: PD9
sense_resistor: 0.110
run_current: 0.850
#hold_current: 0.5
#stealthchop_threshold: 999999
interpolate: True #false

[filament_switch_sensor e0_sensor]
pause_on_runout: true
switch_pin: !PA4
#runout_gcode: 
  #M600

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
min_temp: 0
max_temp: 130

control: pid #60
pid_kp: 72.453
pid_ki: 0.707
pid_kd: 1855.710


#####################################################################
# 	Fan Control
#####################################################################

[heater_fan nozzle_cooling_fan]
pin: PB1
max_power: 1
shutdown_speed: 0


[fan]
pin: PC14   # fan1
#pin: PB1 # fan2


[temperature_fan BTT-PI]
pin: PB0
max_power: 1.0
min_temp: 0
max_temp: 100
kick_start_time: 0.5
off_below: 0.2
sensor_type: temperature_host
control: pid
pid_kp: 2.0
pid_ki: 0.25
pid_kd: 5 #35.0
pid_deriv_time: 2.0
min_speed: 0.0
max_speed: 1.0
target_temp: 50

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Bed_2]
sensor_pin: PA2
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120


#####################################################################
# Kinematics Settings
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 30
max_z_accel: 200

########################################
# EXP1 / EXP2 (display) pins
########################################

